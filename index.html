<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Booking & Invoicing System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
  :root {
    --bg: #f5f7fb;
    --card: #fff;
    --ink: #111;
    --muted: #6b7280;
    --primary: #2563eb;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body {
    margin: 0;
    background: var(--bg);
    font: 14px/1.4 system-ui, Segoe UI, Roboto, Arial;
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap {
    max-width: 1050px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.06);
    padding: 16px;
  }
  .kpi {
    flex: 1 1 230px;
  }
  .kpi h3 {
    margin: 0 0 8px 0;
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .kpi .v {
    font-size: 22px;
    font-weight: 700;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin: 14px 0;
    flex-wrap: wrap;
  }
  input, select, button, textarea {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px 12px;
    background: #fff;
    font: inherit;
    min-width: 120px;
  }
  button {
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  button.primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  button.primary:hover {
    background: #1d4ed8;
  }
  button.danger {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
  }
  button.danger:hover {
    background: #b91c1c;
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 10px;
  }
  th {
    font-weight: 600;
    color: var(--muted);
    text-align: left;
    padding: 8px 12px;
  }
  td {
    background: #fff;
    padding: 12px;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
    vertical-align: top;
  }
  tr td:first-child {
    border-left: 1px solid #eee;
    border-top-left-radius: 12px;
    border-bottom-left-radius: 12px;
  }
  tr td:last-child {
    border-right: 1px solid #eee;
    border-top-right-radius: 12px;
    border-bottom-right-radius: 12px;
  }
  .badge {
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 12px;
    display: inline-block;
  }
  .paid {
    background: rgba(16,185,129,.12);
    color: #065f46;
  }
  .pending {
    background: rgba(245,158,11,.14);
    color: #92400e;
  }
  .right {
    text-align: right;
  }
  .actions {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .actions button {
    border: none;
    background: transparent;
    padding: 6px;
    border-radius: 6px;
    font-size: 16px;
  }
  .actions button:hover {
    background: rgba(0,0,0,.05);
  }
  .drawer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    align-items: flex-start;
    justify-content: flex-end;
    z-index: 100;
  }
  .panel {
    width: 420px;
    max-width: 92vw;
    background: #fff;
    height: 100%;
    padding: 18px 16px 24px 16px;
    overflow-y: auto;
  }
  .panel h2 {
    margin: 8px 0 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .muted {
    color: var(--muted);
  }
  .loading {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(0,0,0,.1);
    border-radius: 50%;
    border-top-color: var(--primary);
    animation: spin 1s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin {
    to { transform: rotate(360deg) }
  }
  /* Auth box */
  .auth {
    max-width: 460px;
    margin: 32px auto;
    padding: 24px;
  }
  .hidden {
    display: none;
  }
  /* Toast notifications */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 12px 16px;
    border-radius: 8px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    z-index: 1000;
    display: none;
  }
  /* Mobile tweaks */
  @media (max-width: 720px) {
    .grid {
      grid-template-columns: 1fr;
    }
    .toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    table {
      display: block;
      overflow-x: auto;
      white-space: nowrap;
    }
    .kpi {
      flex: 1 1 100%;
    }
    .actions {
      flex-direction: column;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Moments Booking</h1>

  <!-- AUTH -->
  <section id="authBox" class="card auth">
    <h3>Login or Sign up</h3>
    <div class="grid">
      <input id="authEmail" type="email" placeholder="Email" />
      <input id="authPass" type="password" placeholder="Password" />
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="btnLogin" class="primary">Login</button>
        <button id="btnSignup">Sign up</button>
        <button id="btnReset" style="margin-left:auto;font-size:13px">Forgot password?</button>
      </div>
      <p class="muted" style="margin:0">Your data is stored securely per account.</p>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="row">
      <div class="card kpi"><h3>Clients</h3><div class="v" id="kpiClients">0</div></div>
      <div class="card kpi"><h3>Bookings</h3><div class="v" id="kpiBookings">0</div></div>
      <div class="card kpi"><h3>Earnings (Paid)</h3><div class="v" id="kpiEarnings">PKR 0</div></div>
      <div class="card kpi"><h3>Pending</h3><div class="v" id="kpiPending">PKR 0</div></div>
    </div>

    <div class="toolbar">
      <input id="q" placeholder="Search bookings... (name/phone/date)" style="flex:1;min-width:220px"/>
      <select id="filterStatus" style="min-width:120px">
        <option value="">All Statuses</option>
        <option value="paid">Paid</option>
        <option value="pending">Pending</option>
      </select>
      <button class="primary" id="btnNew">+ New Booking</button>
      <button id="btnExportExcel">Export Excel</button>
      <button id="btnLogout" style="margin-left:auto">Logout</button>
    </div>

    <div class="card">
      <table id="tbl">
        <thead>
          <tr><th>Client</th><th class="right">Date & Time</th><th class="right">Amount</th><th>Status</th><th class="right">Paid</th><th class="right">Balance</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="muted" id="empty" style="display:none;margin:12px 6px">No bookings yet.</p>
    </div>
  </section>
</div>

<!-- Drawer -->
<div class="drawer" id="drawer">
  <div class="panel">
    <h2 id="formTitle">Add Booking</h2>
    <div class="grid">
      <div><label>Client Name<br><input id="f_name" required></label></div>
      <div><label>Phone<br><input id="f_phone" type="tel"></label></div>
      <div><label>Date<br><input id="f_date" required></label></div>
      <div><label>From<br><input id="f_from" required></label></div>
      <div><label>To<br><input id="f_to" required></label></div>
      <div><label>Total Amount (PKR)<br><input id="f_amount" type="number" min="0" required></label></div>
      <div><label>Paid Amount (PKR)<br><input id="f_paid" type="number" min="0" value="0"></label></div>
      <div><label>Notes<br><textarea id="f_notes" rows="2"></textarea></label></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="primary" id="btnSave">Save</button>
      <button id="btnCancel">Cancel</button>
      <button id="btnDelete" class="danger hidden">Delete</button>
    </div>
  </div>
</div>

<!-- Toast Notification -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
document.addEventListener('DOMContentLoaded', async () => {
  // Debug helper
  window.$$ = (selector) => document.querySelector(selector);
  
  // Initialize Supabase
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  const SUPABASE_URL = 'https://zzcydkmhxmxmsbvdyglt.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6Y3lka21oeG14bXNidmR5Z2x0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU1NTQwMjMsImV4cCI6MjA3MTEzMDAyM30.egNDi5EmTkoMW_kcWZwA185UjJFiYIlxftgjUiCZyag';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  console.log('Supabase initialized:', !!supabase);

  // State management
  const state = { 
    clients: [], 
    bookings: [], 
    user: null,
    currentBooking: null
  };

  // Toast notification system
  function showToast(message, duration = 3000) {
    const toast = $$('#toast');
    toast.textContent = message;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, duration);
  }

  // ----------------- AUTHENTICATION -----------------
  $$('#btnLogin').addEventListener('click', handleLogin);
  $$('#btnSignup').addEventListener('click', handleSignup);
  $$('#btnReset').addEventListener('click', handlePasswordReset);
  $$('#btnLogout').addEventListener('click', handleLogout);

  async function handleLogin() {
    try {
      const email = $$('#authEmail').value.trim();
      const password = $$('#authPass').value.trim();
      
      if (!email || !password) {
        showToast('Email and password required');
        return;
      }

      $$('#btnLogin').disabled = true;
      $$('#btnLogin').innerHTML = '<span class="loading"></span> Logging in...';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) throw error;
      
      state.user = data.user;
      showToast(`Welcome back, ${email.split('@')[0]}!`);
      await refreshAll();
      
    } catch (error) {
      console.error('Login failed:', error);
      showToast(error.message);
    } finally {
      $$('#btnLogin').disabled = false;
      $$('#btnLogin').textContent = 'Login';
    }
  }

  async function handleSignup() {
    try {
      const email = $$('#authEmail').value.trim();
      const password = $$('#authPass').value.trim();
      
      if (!email || !password) {
        showToast('Email and password required');
        return;
      }

      $$('#btnSignup').disabled = true;
      $$('#btnSignup').innerHTML = '<span class="loading"></span> Signing up...';

      const { error } = await supabase.auth.signUp({ 
        email, 
        password,
        options: {
          emailRedirectTo: window.location.href
        }
      });

      if (error) throw error;
      
      showToast('Sign up successful! Please check your email for confirmation.');
      
    } catch (error) {
      console.error('Signup failed:', error);
      showToast(error.message);
    } finally {
      $$('#btnSignup').disabled = false;
      $$('#btnSignup').textContent = 'Sign up';
    }
  }

  async function handlePasswordReset() {
    try {
      const email = $$('#authEmail').value.trim();
      if (!email) {
        showToast('Please enter your email');
        return;
      }

      $$('#btnReset').disabled = true;
      $$('#btnReset').innerHTML = '<span class="loading"></span> Sending...';

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.href
      });

      if (error) throw error;
      
      showToast('Password reset link sent to your email');
      
    } catch (error) {
      console.error('Password reset failed:', error);
      showToast(error.message);
    } finally {
      $$('#btnReset').disabled = false;
      $$('#btnReset').textContent = 'Forgot password?';
    }
  }

  async function handleLogout() {
    try {
      await supabase.auth.signOut();
      showToast('Logged out successfully');
      setTimeout(() => location.reload(), 1000);
    } catch (error) {
      console.error('Logout failed:', error);
      showToast(error.message);
    }
  }

  // Auth state listener
  supabase.auth.onAuthStateChange(async (event, session) => {
    const loggedIn = !!session?.user;
    state.user = session?.user || null;
    
    $$('#authBox').classList.toggle('hidden', loggedIn);
    $$('#app').classList.toggle('hidden', !loggedIn);
    
    if (loggedIn) {
      await refreshAll();
    }
  });

  // Check session on load
  const { data: { session } } = await supabase.auth.getSession();
  if (session?.user) {
    state.user = session.user;
    $$('#authBox').classList.add('hidden');
    $$('#app').classList.remove('hidden');
    await refreshAll();
  }

  // ----------------- DATA MANAGEMENT -----------------
  async function loadClients() {
    try {
      const { data, error } = await supabase
        .from('clients')
        .select('*')
        .eq('user_id', state.user.id)
        .order('name');
        
      if (error) throw error;
      
      state.clients = data || [];
    } catch (error) {
      console.error('Failed to load clients:', error);
      showToast('Failed to load clients');
    }
  }

  async function loadBookings() {
    try {
      const { data, error } = await supabase
        .from('bookings')
        .select('*')
        .eq('user_id', state.user.id)
        .order('date', { ascending: false });
        
      if (error) throw error;
      
      state.bookings = data || [];
    } catch (error) {
      console.error('Failed to load bookings:', error);
      showToast('Failed to load bookings');
    }
  }

  async function upsertClient(name, phone) {
    try {
      // Check for existing clients with similar name or phone
      const { data: existing } = await supabase
        .from('clients')
        .select('*')
        .eq('user_id', state.user.id)
        .or(`name.ilike.%${name}%,phone.eq.${phone}`)
        .limit(1);
        
      if (existing?.length) return existing[0].id;
      
      // Create new client if no match found
      const { data, error } = await supabase
        .from('clients')
        .insert({ 
          user_id: state.user.id, 
          name: name.trim(), 
          phone: (phone || '').trim() 
        })
        .select('id')
        .single();
        
      if (error) throw error;
      
      state.clients.push({ 
        id: data.id, 
        user_id: state.user.id, 
        name, 
        phone 
      });
      
      return data.id;
    } catch (error) {
      console.error('Failed to upsert client:', error);
      showToast(error.message);
      throw error;
    }
  }

  async function saveBooking(booking) {
    try {
      if (!booking.id) {
        // Create new booking
        const { data, error } = await supabase
          .from('bookings')
          .insert({ ...booking, user_id: state.user.id })
          .select('*')
          .single();
          
        if (error) throw error;
        
        state.bookings.push(data);
        showToast('Booking created successfully');
        return data;
      } else {
        // Update existing booking
        const { error } = await supabase
          .from('bookings')
          .update(booking)
          .eq('id', booking.id)
          .eq('user_id', state.user.id);
          
        if (error) throw error;
        
        const index = state.bookings.findIndex(b => b.id === booking.id);
        if (index >= 0) state.bookings[index] = { ...state.bookings[index], ...booking };
        
        showToast('Booking updated successfully');
        return booking;
      }
    } catch (error) {
      console.error('Failed to save booking:', error);
      showToast(error.message);
      throw error;
    }
  }

  async function deleteBooking(id) {
    try {
      const { error } = await supabase
        .from('bookings')
        .delete()
        .eq('id', id)
        .eq('user_id', state.user.id);
        
      if (error) throw error;
      
      state.bookings = state.bookings.filter(b => b.id !== id);
      showToast('Booking deleted successfully');
    } catch (error) {
      console.error('Failed to delete booking:', error);
      showToast(error.message);
      throw error;
    }
  }

  async function refreshAll() {
    try {
      $$('#tbl tbody').innerHTML = '<tr><td colspan="7" style="text-align:center"><span class="loading"></span> Loading...</td></tr>';
      await Promise.all([loadClients(), loadBookings()]);
      render();
    } catch (error) {
      console.error('Failed to refresh data:', error);
      showToast('Failed to load data');
    }
  }

  // ----------------- UI RENDERING -----------------
  function updateMetrics() {
    const clients = new Set(state.clients.map(c => c.id));
    const earnings = state.bookings.reduce((sum, b) => sum + (b.paid || 0), 0);
    const pending = state.bookings.reduce((sum, b) => {
      const balance = (b.amount || 0) - (b.paid || 0);
      return sum + (balance > 0 ? balance : 0);
    }, 0);
    
    $$('#kpiClients').textContent = clients.size;
    $$('#kpiBookings').textContent = state.bookings.length;
    $$('#kpiEarnings').textContent = `PKR ${earnings.toLocaleString()}`;
    $$('#kpiPending').textContent = `PKR ${pending.toLocaleString()}`;
  }

  function renderBookings() {
    const query = $$('#q').value.trim().toLowerCase();
    const statusFilter = $$('#filterStatus').value;
    const tbody = $$('#tbl tbody');
    
    tbody.innerHTML = '';
    
    const filteredBookings = state.bookings
      .filter(booking => {
        const client = state.clients.find(c => c.id === booking.client_id) || { name: '', phone: '' };
        const searchText = [
          client.name,
          client.phone,
          booking.date,
          booking.from_time,
          booking.to_time,
          booking.amount,
          booking.paid
        ].join(' ').toLowerCase();
        
        const matchesSearch = !query || searchText.includes(query);
        
        const balance = (booking.amount || 0) - (booking.paid || 0);
        const matchesStatus = !statusFilter || 
          (statusFilter === 'paid' && balance <= 0) || 
          (statusFilter === 'pending' && balance > 0);
        
        return matchesSearch && matchesStatus;
      })
      .sort((a, b) => new Date(b.date) - new Date(a.date));
    
    $$('#empty').style.display = filteredBookings.length ? 'none' : 'block';
    
    filteredBookings.forEach(booking => {
      const client = state.clients.find(c => c.id === booking.client_id) || { name: '', phone: '' };
      const balance = (booking.amount || 0) - (booking.paid || 0);
      
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>
          <strong>${client.name}</strong>
          <div class="muted">${client.phone || ''}</div>
        </td>
        <td class="right">
          ${booking.date}<br>
          ${booking.from_time || ''}–${booking.to_time || ''}
        </td>
        <td class="right">PKR ${(booking.amount || 0).toLocaleString()}</td>
        <td>
          <span class="badge ${balance <= 0 ? 'paid' : 'pending'}">
            ${balance <= 0 ? 'Paid' : 'Pending'}
          </span>
        </td>
        <td class="right">PKR ${(booking.paid || 0).toLocaleString()}</td>
        <td class="right">PKR ${Math.max(balance, 0).toLocaleString()}</td>
        <td class="actions">
          <button title="Mark Paid">✅</button>
          <button title="Invoice PDF">🧾</button>
          <button title="Edit">✏️</button>
          <button title="Delete">🗑️</button>
        </td>
      `;
      
      const [paidBtn, invoiceBtn, editBtn, deleteBtn] = row.querySelectorAll('button');
      
      paidBtn.addEventListener('click', async () => {
        if (confirm('Mark this booking as fully paid?')) {
          try {
            await saveBooking({ ...booking, paid: booking.amount });
          } catch (error) {
            console.error('Failed to mark as paid:', error);
          }
        }
      });
      
      invoiceBtn.addEventListener('click', () => {
        generateInvoicePDF(booking, client, Math.max(balance, 0));
      });
      
      editBtn.addEventListener('click', () => {
        openBookingForm(booking);
      });
      
      deleteBtn.addEventListener('click', async () => {
        if (confirm('Delete this booking permanently?')) {
          try {
            await deleteBooking(booking.id);
            render();
          } catch (error) {
            console.error('Failed to delete booking:', error);
          }
        }
      });
      
      tbody.appendChild(row);
    });
    
    updateMetrics();
  }

  function render() {
    renderBookings();
  }

  // ----------------- BOOKING FORM -----------------
  $$('#btnNew').addEventListener('click', () => openBookingForm());
  $$('#btnCancel').addEventListener('click', closeBookingForm);
  $$('#btnSave').addEventListener('click', saveBookingForm);
  $$('#btnDelete').addEventListener('click', deleteCurrentBooking);

  // Initialize date/time pickers
  flatpickr('#f_date', {
    dateFormat: 'Y-m-d',
    defaultDate: 'today'
  });
  
  flatpickr('#f_from', {
    enableTime: true,
    noCalendar: true,
    dateFormat: 'H:i',
    time_24hr: true,
    defaultHour: 10,
    minuteIncrement: 15
  });
  
  flatpickr('#f_to', {
    enableTime: true,
    noCalendar: true,
    dateFormat: 'H:i',
    time_24hr: true,
    defaultHour: 12,
    minuteIncrement: 15
  });

  function openBookingForm(booking = null) {
    state.currentBooking = booking;
    const client = booking ? 
      state.clients.find(c => c.id === booking.client_id) || { name: '', phone: '' } : 
      { name: '', phone: '' };
    
    $$('#formTitle').textContent = booking ? 'Edit Booking' : 'New Booking';
    $$('#btnDelete').classList.toggle('hidden', !booking);
    
    $$('#f_name').value = client.name;
    $$('#f_phone').value = client.phone || '';
    $$('#f_date').value = booking?.date || '';
    $$('#f_from').value = booking?.from_time || '';
    $$('#f_to').value = booking?.to_time || '';
    $$('#f_amount').value = booking?.amount || '';
    $$('#f_paid').value = booking?.paid || 0;
    $$('#f_notes').value = booking?.notes || '';
    
    $$('#drawer').style.display = 'flex';
  }

  function closeBookingForm() {
    $$('#drawer').style.display = 'none';
    state.currentBooking = null;
  }

  async function saveBookingForm() {
    try {
      const name = $$('#f_name').value.trim();
      const phone = $$('#f_phone').value.trim();
      const date = $$('#f_date').value;
      const fromTime = $$('#f_from').value;
      const toTime = $$('#f_to').value;
      const amount = parseFloat($$('#f_amount').value) || 0;
      const paid = parseFloat($$('#f_paid').value) || 0;
      const notes = $$('#f_notes').value.trim();
      
      // Validation
      if (!name || !date || !fromTime || !toTime) {
        showToast('Name, Date, From, and To are required');
        return;
      }
      
      if (new Date(`${date}T${toTime}`) <= new Date(`${date}T${fromTime}`)) {
        showToast('End time must be after start time');
        return;
      }
      
      if (amount <= 0) {
        showToast('Amount must be greater than 0');
        return;
      }
      
      if (paid < 0) {
        showToast('Paid amount cannot be negative');
        return;
      }
      
      $$('#btnSave').disabled = true;
      $$('#btnSave').innerHTML = '<span class="loading"></span> Saving...';
      
      const clientId = await upsertClient(name, phone);
      
      const bookingData = {
        id: state.currentBooking?.id,
        client_id: clientId,
        date,
        from_time: fromTime,
        to_time: toTime,
        amount,
        paid,
        notes
      };
      
      await saveBooking(bookingData);
      closeBookingForm();
      render();
      
    } catch (error) {
      console.error('Failed to save booking:', error);
    } finally {
      $$('#btnSave').disabled = false;
      $$('#btnSave').textContent = 'Save';
    }
  }

  async function deleteCurrentBooking() {
    if (!state.currentBooking?.id) return;
    
    if (confirm('Delete this booking permanently?')) {
      try {
        await deleteBooking(state.currentBooking.id);
        closeBookingForm();
        render();
      } catch (error) {
        console.error('Failed to delete booking:', error);
      }
    }
  }

  // ----------------- INVOICE PDF -----------------
  function generateInvoicePDF(booking, client, balance) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // Header
    doc.setFillColor(17, 17, 17);
    doc.rect(0, 0, 210, 22, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(16);
    doc.text('Reservation Voucher', 14, 14);
    
    // Business info
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(11);
    let y = 30;
    
    doc.setFont(undefined, 'bold');
    doc.text('From: Your Business Name', 14, y);
    doc.setFont(undefined, 'normal');
    y += 8;
    
    // Client info
    doc.setFont(undefined, 'bold');
    doc.text(`Bill To: ${client.name}`, 14, y);
    doc.setFont(undefined, 'normal');
    if (client.phone) {
      y += 8;
      doc.text(`Phone: ${client.phone}`, 14, y);
    }
    y += 8;
    
    // Booking details
    doc.text(`Date: ${booking.date}`, 14, y);
    doc.text(`Time: ${booking.from_time} - ${booking.to_time}`, 80, y);
    y += 12;
    
    // Divider
    doc.setDrawColor(230, 230, 230);
    doc.line(14, y, 196, y);
    y += 8;
    
    // Table header
    doc.setFont(undefined, 'bold');
    doc.text('Description', 14, y);
    doc.text('Amount (PKR)', 196, y, { align: 'right' });
    doc.setFont(undefined, 'normal');
    y += 8;
    doc.line(14, y, 196, y);
    y += 8;
    
    // Booking item
    doc.text('Booking Fee', 14, y);
    doc.text((booking.amount || 0).toLocaleString(), 196, y, { align: 'right' });
    y += 10;
    doc.line(14, y, 196, y);
    y += 10;
    
    // Totals
    doc.setFont(undefined, 'bold');
    doc.text('Amount Paid', 14, y);
    doc.text((booking.paid || 0).toLocaleString(), 196, y, { align: 'right' });
    y += 8;
    doc.text('Balance Due', 14, y);
    doc.text(balance.toLocaleString(), 196, y, { align: 'right' });
    y += 12;
    
    // Notes
    if (booking.notes) {
      doc.setFont(undefined, 'italic');
      doc.text(`Notes: ${booking.notes}`, 14, y, { maxWidth: 180 });
      y += 12;
    }
    
    // Footer
    doc.setFontSize(10);
    doc.setTextColor(107, 114, 128);
    doc.text('Thank you for your business.', 14, 275);
    
    // Save PDF
    const fileName = `invoice_${client.name.replace(/\s+/g, '_')}_${booking.date}.pdf`;
    doc.save(fileName);
  }

  // ----------------- EXPORT EXCEL -----------------
  $$('#btnExportExcel').addEventListener('click', exportToExcel);

  async function exportToExcel() {
    try {
      $$('#btnExportExcel').disabled = true;
      $$('#btnExportExcel').innerHTML = '<span class="loading"></span> Exporting...';
      
      // Get bookings with client info
      const { data: bookings } = await supabase
        .from('bookings')
        .select(`
          *,
          clients(name, phone)
        `)
        .eq('user_id', state.user.id);
      
      // Format bookings data
      const formattedBookings = (bookings || []).map(b => {
        const balance = (b.amount || 0) - (b.paid || 0);
        return {
          'Client Name': b.clients?.name || '',
          'Client Phone': b.clients?.phone || '',
          'Date': b.date,
          'Time': `${b.from_time} - ${b.to_time}`,
          'Amount (PKR)': b.amount,
          'Paid (PKR)': b.paid,
          'Balance (PKR)': Math.max(balance, 0),
          'Status': balance <= 0 ? 'Paid' : 'Pending',
          'Notes': b.notes || ''
        };
      });
      
      // Format clients data
      const formattedClients = state.clients.map(c => {
        const clientBookings = state.bookings.filter(b => b.client_id === c.id);
        const totalPaid = clientBookings.reduce((sum, b) => sum + (b.paid || 0), 0);
        const totalBalance = clientBookings.reduce((sum, b) => {
          const balance = (b.amount || 0) - (b.paid || 0);
          return sum + (balance > 0 ? balance : 0);
        }, 0);
        
        return {
          'Name': c.name,
          'Phone': c.phone || '',
          'Total Bookings': clientBookings.length,
          'Total Paid (PKR)': totalPaid,
          'Total Balance (PKR)': totalBalance
        };
      });
      
      // Create workbook
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, 
        XLSX.utils.json_to_sheet(formattedBookings), 
        'Bookings'
      );
      XLSX.utils.book_append_sheet(wb, 
        XLSX.utils.json_to_sheet(formattedClients), 
        'Clients'
      );
      
      // Generate filename with current date
      const today = new Date().toISOString().slice(0, 10);
      const fileName = `bookings_export_${today}.xlsx`;
      
      // Download file
      XLSX.writeFile(wb, fileName);
      showToast('Export completed successfully');
      
    } catch (error) {
      console.error('Export failed:', error);
      showToast('Export failed: ' + error.message);
    } finally {
      $$('#btnExportExcel').disabled = false;
      $$('#btnExportExcel').textContent = 'Export Excel';
    }
  }

  // ----------------- SEARCH & FILTERS -----------------
  $$('#q').addEventListener('input', render);
  $$('#filterStatus').addEventListener('change', render);

  // Initial render
  if (state.user) {
    render();
  }
});
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Simple Booking & Invoicing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
  :root{--bg:#f5f7fb;--card:#fff;--ink:#111;--muted:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font:14px/1.4 system-ui,Segoe UI,Roboto,Arial;color:var(--ink)}
  .wrap{max-width:1050px;margin:24px auto;padding:0 16px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .card{background:var(--card);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.06);padding:16px}
  .kpi{flex:1 1 230px}
  .kpi h3{margin:0 0 8px 0;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .kpi .v{font-size:22px;font-weight:700}
  .toolbar{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}
  input,select,button,textarea{border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;background:#fff;font:inherit}
  button{cursor:pointer}
  button.primary{background:#111;color:#fff}
  table{width:100%;border-collapse:separate;border-spacing:0 10px}
  th{font-weight:600;color:var(--muted);text-align:left}
  td{background:#fff;padding:12px;border-top:1px solid #eee;border-bottom:1px solid #eee}
  tr td:first-child{border-left:1px solid #eee;border-top-left-radius:12px;border-bottom-left-radius:12px}
  tr td:last-child{border-right:1px solid #eee;border-top-right-radius:12px;border-bottom-right-radius:12px}
  .badge{padding:4px 8px;border-radius:999px;font-size:12px}
  .paid{background:rgba(16,185,129,.12);color:#065f46}
  .pending{background:rgba(245,158,11,.14);color:#92400e}
  .right{text-align:right}
  .actions button{border:none;background:transparent;padding:6px}
  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:flex-end}
  .panel{width:420px;max-width:92vw;background:#fff;height:100%;padding:18px 16px 24px 16px}
  .panel h2{margin:8px 0 12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .muted{color:var(--muted)}
  /* Auth box */
  .auth{max-width:460px;margin:32px auto;padding:16px}
  .hidden{display:none}
  /* Mobile tweaks */
  @media (max-width: 720px){
    .grid{grid-template-columns:1fr}
    .toolbar{flex-direction:column;align-items:stretch}
    table{display:block;overflow-x:auto;white-space:nowrap}
    .kpi{flex:1 1 100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Simple Booking & Invoicing</h1>

  <!-- AUTH -->
  <section id="authBox" class="card auth">
    <h3>Login or Sign up</h3>
    <div class="grid">
      <input id="authEmail" type="email" placeholder="Email" />
      <input id="authPass" type="password" placeholder="Password" />
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="btnLogin" class="primary">Login</button>
        <button id="btnSignup">Sign up</button>
      </div>
      <p class="muted" style="margin:0">Your data is stored securely per account.</p>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="row">
      <div class="card kpi"><h3>Clients</h3><div class="v" id="kpiClients">0</div></div>
      <div class="card kpi"><h3>Bookings</h3><div class="v" id="kpiBookings">0</div></div>
      <div class="card kpi"><h3>Earnings (Paid)</h3><div class="v" id="kpiEarnings">PKR 0</div></div>
      <div class="card kpi"><h3>Pending</h3><div class="v" id="kpiPending">PKR 0</div></div>
    </div>

    <div class="toolbar">
      <input id="q" placeholder="Search bookings... (name/phone/date)" style="flex:1;min-width:220px"/>
      <button class="primary" id="btnNew">+ New Booking</button>
      <button id="btnExportExcel">Export Excel</button>
      <button id="btnLogout" style="margin-left:auto">Logout</button>
    </div>

    <div class="card">
      <table id="tbl">
        <thead>
          <tr><th>Client</th><th class="right">Date & Time</th><th class="right">Amount</th><th>Status</th><th class="right">Paid</th><th class="right">Balance</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="muted" id="empty" style="display:none;margin:12px 6px">No bookings yet.</p>
    </div>
  </section>
</div>

<!-- Drawer -->
<div class="drawer" id="drawer">
  <div class="panel">
    <h2 id="formTitle">Add Booking</h2>
    <div class="grid">
      <div><label>Client Name<br><input id="f_name"></label></div>
      <div><label>Phone<br><input id="f_phone"></label></div>
      <div><label>Date<br><input id="f_date"></label></div>
      <div><label>From<br><input id="f_from"></label></div>
      <div><label>To<br><input id="f_to"></label></div>
      <div><label>Total Amount (PKR)<br><input id="f_amount" type="number" min="0"></label></div>
      <div><label>Paid Amount (PKR)<br><input id="f_paid" type="number" min="0" value="0"></label></div>
      <div><label>Notes<br><input id="f_notes"></label></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="primary" id="btnSave">Save</button>
      <button id="btnCancel">Cancel</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ====== EDIT THESE ======
const SUPABASE_URL = 'https://zzcydkmhxmxmsbvdyglt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6Y3lka21oeG14bXNidmR5Z2x0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU1NTQwMjMsImV4cCI6MjA3MTEzMDAyM30.egNDi5EmTkoMW_kcWZwA185UjJFiYIlxftgjUiCZyag';
// =========================

const supabase = createClient('https://zzcydkmhxmxmsbvdyglt.supabase.co',  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6Y3lka21oeG14bXNidmR5Z2x0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU1NTQwMjMsImV4cCI6MjA3MTEzMDAyM30.egNDi5EmTkoMW_kcWZwA185UjJFiYIlxftgjUiCZyag');

// Local UI state (mirrors DB rows)
const state = { clients: [], bookings: [], user: null };
const $$ = (s)=>document.querySelector(s);

// ---------- Auth ----------
$$('#btnSignup').onclick = async ()=>{
  const email=$$('#authEmail').value.trim();
  const password=$$('#authPass').value.trim();
  if(!email||!password) return alert('Email & password required');
  const { error } = await supabase.auth.signUp({ email, password });
  if(error) alert(error.message); else alert('Sign up successful. Check your email if confirmation is enabled.');
};
$$('#btnLogin').onclick = async ()=>{
  const email=$$('#authEmail').value.trim();
  const password=$$('#authPass').value.trim();
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error) return alert(error.message);
  state.user = data.user; await refreshAll();
};
$$('#btnLogout').onclick = async ()=>{ await supabase.auth.signOut(); location.reload(); };

supabase.auth.onAuthStateChange(async (_evt, session)=>{
  const logged = !!session?.user;
  state.user = session?.user || null;
  $$('#authBox').classList.toggle('hidden', logged);
  $$('#app').classList.toggle('hidden', !logged);
  if(logged) await refreshAll();
});

// Try restore session on load
const { data: { session } } = await supabase.auth.getSession();
if(session?.user){ state.user=session.user; $$('#authBox').classList.add('hidden'); $$('#app').classList.remove('hidden'); await refreshAll(); }

// ---------- DB helpers ----------
async function loadClients(){
  const { data, error } = await supabase.from('clients').select('*').eq('user_id', state.user.id).order('name');
  if(error){ console.error(error); return; }
  state.clients = data||[];
}
async function loadBookings(){
  const { data, error } = await supabase.from('bookings').select('*').eq('user_id', state.user.id).order('date');
  if(error){ console.error(error); return; }
  state.bookings = data||[];
}
async function upsertClient(name, phone){
  const match = state.clients.find(x=>x.name.trim().toLowerCase()===name.trim().toLowerCase() && (x.phone||'')===(phone||''));
  if(match) return match.id;
  const { data, error } = await supabase.from('clients').insert({ user_id: state.user.id, name: name.trim(), phone: (phone||'').trim() }).select('id').single();
  if(error){ alert(error.message); throw error; }
  state.clients.push({ id:data.id, user_id:state.user.id, name, phone });
  return data.id;
}
async function addOrUpdateBooking(bk){
  if(!bk.id){
    const { data, error } = await supabase.from('bookings').insert({ ...bk, user_id: state.user.id }).select('*').single();
    if(error) return alert(error.message);
    state.bookings.push(data);
  } else {
    const { error } = await supabase.from('bookings').update(bk).eq('id', bk.id).eq('user_id', state.user.id);
    if(error) return alert(error.message);
    const i = state.bookings.findIndex(x=>x.id===bk.id); if(i>=0) state.bookings[i] = { ...state.bookings[i], ...bk };
  }
  render();
}

async function refreshAll(){
  await Promise.all([loadClients(), loadBookings()]);
  render();
}

// ---------- UI render ----------
function metrics(){
  const clients=new Set(state.clients.map(c=>c.id));
  const earnings=state.bookings.reduce((s,b)=>s+(+b.paid||0),0);
  const pending=state.bookings.reduce((s,b)=>{const bal=(+b.amount||0)-(+b.paid||0);return s+(bal>0?bal:0)},0);
  $$('#kpiClients').textContent=clients.size;
  $$('#kpiBookings').textContent=state.bookings.length;
  $$('#kpiEarnings').textContent='PKR '+earnings.toLocaleString();
  $$('#kpiPending').textContent='PKR '+pending.toLocaleString();
}

function render(){
  const q=$$('#q').value.trim().toLowerCase();
  const tb=$$('#tbl tbody'); tb.innerHTML='';
  const rows=state.bookings
    .slice().sort((a,b)=> (a.date+a.from_time).localeCompare(b.date+b.from_time))
    .filter(b=>{
      const c=state.clients.find(x=>x.id===b.client_id)||{name:'',phone:''};
      const hay=[c.name,c.phone,b.date,b.from_time,b.to_time,(b.amount||0),(b.paid||0)].join(' ').toLowerCase();
      return !q || hay.includes(q);
    });
  $$('#empty').style.display=rows.length? 'none':'block';
  rows.forEach(b=>{
    const c=state.clients.find(x=>x.id===b.client_id)||{name:'',phone:''};
    const bal=(+b.amount||0)-(+b.paid||0);
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><strong>${c.name}</strong><div class="muted">${c.phone||''}</div></td>
      <td class="right">${b.date} • ${b.from_time||''}–${b.to_time||''}</td>
      <td class="right">PKR ${(+b.amount||0).toLocaleString()}</td>
      <td><span class="badge ${bal<=0?'paid':'pending'}">${bal<=0?'Paid':'Pending'}</span></td>
      <td class="right">PKR ${(+b.paid||0).toLocaleString()}</td>
      <td class="right">PKR ${Math.max(bal,0).toLocaleString()}</td>
      <td class="actions">
        <button title="Mark Paid">✅</button>
        <button title="Invoice PDF">🧾</button>
        <button title="Edit">✏️</button>
        <button title="Delete">🗑️</button>
      </td>`;
    const [btnPaid,btnInv,btnEdit,btnDel]=tr.querySelectorAll('button');
    btnPaid.onclick=async()=>{ await addOrUpdateBooking({ ...b, paid: b.amount }); };
    btnDel.onclick=async()=>{ if(confirm('Delete booking?')){ await supabase.from('bookings').delete().eq('id', b.id).eq('user_id', state.user.id); state.bookings=state.bookings.filter(x=>x.id!==b.id); render(); } };
    btnEdit.onclick=()=>openDrawer(b);
    btnInv.onclick=()=>invoicePDF(b,c,Math.max(bal,0));
    tb.appendChild(tr);
  });
  metrics();
}

function openDrawer(bk=null){
  $$('#drawer').style.display='flex';
  $$('#formTitle').textContent=bk?'Edit Booking':'Add Booking';
  const c = bk ? state.clients.find(x=>x.id===bk.client_id) : {name:'',phone:''};
  $$('#f_name').value=c?.name||''; $$('#f_phone').value=c?.phone||'';
  $$('#f_date').value=bk?.date||''; $$('#f_from').value=bk?.from_time||''; $$('#f_to').value=bk?.to_time||'';
  $$('#f_amount').value=bk?.amount||''; $$('#f_paid').value=bk?.paid||0; $$('#f_notes').value=bk?.notes||'';
  $$('#btnSave').onclick=async()=>{
    const name=$$('#f_name').value.trim();
    const phone=$$('#f_phone').value.trim();
    const date=$$('#f_date').value; const from=$$('#f_from').value; const to=$$('#f_to').value;
    const amount=+$$('#f_amount').value||0; const paid=+$$('#f_paid').value||0;
    const notes=$$('#f_notes').value.trim();
    if(!name||!date||!from||!to){ alert('Name, Date, From, To are required.'); return; }
    const clientId=await upsertClient(name,phone);
    await addOrUpdateBooking({ id: bk?.id, client_id:clientId, date, from_time:from, to_time:to, amount, paid, notes });
    closeDrawer();
  };
}
function closeDrawer(){ $$('#drawer').style.display='none'; }

$$('#btnNew').onclick=()=>openDrawer();
$$('#btnCancel').onclick=closeDrawer;

flatpickr('#f_date',{dateFormat:'Y-m-d'});
flatpickr('#f_from',{enableTime:true,noCalendar:true,dateFormat:'H:i'});
flatpickr('#f_to',{enableTime:true,noCalendar:true,dateFormat:'H:i'});
$$('#q').addEventListener('input',render);

// ---------- PDF invoice (styled like your voucher) ----------
function invoicePDF(b,c,bal){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  // Header bar
  doc.setFillColor(17,17,17); // black
  doc.rect(0,0,210,22,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(16); doc.text('Reservation Voucher', 14, 14);
  // Body
  doc.setTextColor(0,0,0);
  doc.setFontSize(11);
  let y=30;
  doc.text(`From: Your Business`,14,y); y+=8;
  doc.text(`Bill To: ${c.name} ${c.phone? '('+c.phone+')':''}`,14,y); y+=8;
  doc.text(`Date: ${b.date}   Time: ${b.from_time} - ${b.to_time}`,14,y); y+=12;
  // Divider & rows
  doc.setDrawColor(230,230,230);
  doc.line(14,y,196,y); y+=8;
  doc.text('Description',14,y); doc.text('Amount (PKR)',150,y,{align:'left'}); y+=8;
  doc.line(14,y,196,y); y+=8;
  doc.text('Farmhouse Booking',14,y); doc.text(String((+b.amount||0).toLocaleString()),196,y,{align:'right'}); y+=10;
  doc.line(14,y,196,y); y+=10;
  doc.text('Amount Paid',14,y); doc.text(String((+b.paid||0).toLocaleString()),196,y,{align:'right'}); y+=8;
  doc.text('Balance Due',14,y); doc.text(String(bal.toLocaleString()),196,y,{align:'right'}); y+=12;
  if(b.notes){ doc.text(`Notes: ${b.notes}`,14,y); y+=8; }
  doc.setFontSize(10); doc.setTextColor(107,114,128);
  doc.text('Thank you for your business.',14,275);
  doc.save(`voucher_${c.name.replace(/\s+/g,'_')}_${b.date}.pdf`);
}

// ---------- Export Excel ----------
$$('#btnExportExcel').onclick = async()=>{
  const { data: bookings } = await supabase.from('bookings').select('*').eq('user_id', state.user.id);
  const { data: clients } = await supabase.from('clients').select('*').eq('user_id', state.user.id);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bookings||[]), 'Bookings');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(clients||[]), 'Clients');
  XLSX.writeFile(wb, 'export.xlsx');
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking System</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    nav button { margin: 5px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    #companyLogo { height: 50px; margin-bottom: 10px; }
    #authForm { margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Booking System</h1>
  <img id="companyLogo" src="default.png" alt="Logo">
  <input type="file" id="logoUpload" accept="image/*" style="display:none">

  <div id="authForm">
    <h3>Login / Register</h3>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
    <button onclick="logout()">Logout</button>
  </div>

  <nav>
    <button onclick="showPage('bookings')">Bookings</button>
    <button onclick="showPage('clients')">Clients</button>
    <button onclick="exportExcel()">Export Excel</button>
    <button onclick="document.getElementById('logoUpload').click()">Upload Logo</button>
  </nav>

  <div id="bookingsPage">
    <h2>Bookings</h2>
    <table id="tblBookings">
      <thead><tr><th>Date</th><th>Client</th><th>Amount</th><th>Paid</th><th>Notes</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="clientsPage" style="display:none">
    <h2>Clients</h2>
    <table id="tblClients">
      <thead><tr><th>Name</th><th>Phone</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const supabase = createClient("https://zzcydkmhxmxmsbvdyglt.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6Y3lka21oeG14bXNidmR5Z2x0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU1NTQwMjMsImV4cCI6MjA3MTEzMDAyM30.egNDi5EmTkoMW_kcWZwA185UjJFiYIlxftgjUiCZyag");
  let currentUser = null;

  // Auth
  async function register() {
    let email = document.getElementById("email").value;
    let pw = document.getElementById("password").value;
    let { error } = await supabase.auth.signUp({ email, password: pw });
    if (error) alert(error.message); else alert("Check your email to confirm.");
  }

  async function login() {
    let email = document.getElementById("email").value;
    let pw = document.getElementById("password").value;
    let { data, error } = await supabase.auth.signInWithPassword({ email, password: pw });
    if (error) alert(error.message);
    else { currentUser = data.user; init(); }
  }

  async function logout() {
    await supabase.auth.signOut();
    currentUser=null;
    location.reload();
  }

  // Logo upload
  document.getElementById("logoUpload").onchange = async (e) => {
    if (!currentUser) return;
    const file = e.target.files[0];
    const path = `${currentUser.id}/logo.png`;
    let { error } = await supabase.storage.from("logos").upload(path, file, { upsert:true });
    if (!error) {
      let { data } = supabase.storage.from("logos").getPublicUrl(path);
      document.getElementById("companyLogo").src = data.publicUrl;
      await supabase.from("profiles").upsert({ id: currentUser.id, logo_url: data.publicUrl });
    }
  };

  // UI Switching
  window.showPage = (p) => {
    document.getElementById("bookingsPage").style.display = (p==="bookings")?"block":"none";
    document.getElementById("clientsPage").style.display = (p==="clients")?"block":"none";
    if (p==="clients") loadClients();
    if (p==="bookings") loadBookings();
  }

  // Load Data
  async function loadBookings() {
    if (!currentUser) return;
    let { data } = await supabase.from("bookings").select("date, notes, amount, paid, clients(name)").eq("user_id", currentUser.id);
    const tb=document.querySelector("#tblBookings tbody");
    tb.innerHTML="";
    data.forEach(b=>{
      let tr=document.createElement("tr");
      tr.innerHTML=`<td>${b.date}</td><td>${b.clients?.name||""}</td><td>${b.amount}</td><td>${b.paid}</td><td>${b.notes}</td>`;
      tb.appendChild(tr);
    });
  }

  async function loadClients() {
    if (!currentUser) return;
    let { data } = await supabase.from("clients").select("name,phone").eq("user_id", currentUser.id);
    const tb=document.querySelector("#tblClients tbody");
    tb.innerHTML="";
    data.forEach(c=>{
      let tr=document.createElement("tr");
      tr.innerHTML=`<td>${c.name}</td><td>${c.phone}</td>`;
      tb.appendChild(tr);
    });
  }

  // Export
  window.exportExcel = async () => {
    if (!currentUser) return;
    let { data } = await supabase.from("bookings").select("*").eq("user_id", currentUser.id);
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Bookings");
    XLSX.writeFile(wb, "bookings.xlsx");
  };

  // Init
  async function init() {
    const { data } = await supabase.auth.getUser();
    if (data.user) {
      currentUser = data.user;
      showPage("bookings");
    }
  }
  init();

</script>
</body>
</html>
